name: Patch SystemUI Only

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 'a21s'

      - name: Install Tools & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk patch wget zip unzip
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool.jar

      - name: Download APK and Find Patch
        run: |
          wget -O SystemUI.apk "https://nei5-a0eace4761b8.herokuapp.com/stream/328064?hash=960c8a&d=true"
          find . -name "0001-Add-left-cutout-support.patch" -exec cp {} ./0001-Add-left-cutout-support.patch \;
          
          if [ ! -f "SystemUI.apk" ]; then echo "Error: SystemUI.apk download failed!"; exit 1; fi
          if [ ! -f "0001-Add-left-cutout-support.patch" ]; then echo "Error: Patch file not found!"; exit 1; fi

      - name: Decompile SystemUI.apk (-r)
        run: |
          apktool d -f -r SystemUI.apk -o decompiled_ui

      - name: Apply Patch & Fix 64k Limit
        run: |
          cd decompiled_ui
          patch -p1 -F 3 < ../0001-Add-left-cutout-support.patch || echo "Patch applied"
          
          mkdir -p smali_classes5/com/android/systemui/
          mv smali_classes2/com/android/systemui/wallet smali_classes5/com/android/systemui/wallet 2>/dev/null || true
          mv smali_classes2/com/android/systemui/screenshot smali_classes5/com/android/systemui/screenshot 2>/dev/null || true
          mv smali_classes3/com/android/systemui/dreams smali_classes5/com/android/systemui/dreams 2>/dev/null || true
          mv smali_classes3/com/android/systemui/controls smali_classes5/com/android/systemui/controls 2>/dev/null || true
          mv smali_classes3/com/android/systemui/media smali_classes5/com/android/systemui/media 2>/dev/null || true
          mv smali_classes3/com/android/systemui/recents smali_classes5/com/android/systemui/recents 2>/dev/null || true
          mv smali_classes3/com/android/systemui/tv smali_classes5/com/android/systemui/tv 2>/dev/null || true
          cd ..

      - name: Inject Dex into Original APK (Fix Size Issue)
        run: |
          # 1. ಟೆಂಪರರಿಯಾಗಿ ಬಿಲ್ಡ್ ಮಾಡಿ ಕೇವಲ dex ಫೈಲ್‌ಗಳನ್ನು ಮಾತ್ರ ಹೊರತೆಗೆಯುವುದು
          apktool b decompiled_ui -o temp_build.apk
          unzip -q temp_build.apk "*.dex" -d new_dexes
          
          # 2. ನಿಮ್ಮ ಒರಿಜಿನಲ್ 89MB ಎಪಿಕೆಯನ್ನು ಕಾಪಿ ಮಾಡುವುದು
          cp SystemUI.apk patched_SystemUI.apk
          
          # 3. ಕಂಪ್ರೆಸ್ ಮಾಡದೆ (-0 ಫ್ಲಾಗ್) ಹೊಸ dex ಫೈಲ್‌ಗಳನ್ನು ಒರಿಜಿನಲ್ ಎಪಿಕೆಗೆ ಸೇರಿಸುವುದು
          cd new_dexes
          zip -0 -u ../patched_SystemUI.apk *.dex
          cd ..

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Patched-SystemUI-A21s
          path: patched_SystemUI.apk
